# 正式站由主站自动拉取 dist；本流程构建成功不代表平台多人 API 已部署。
name: Build cards (optional standalone deploy)

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'data/**'
      - 'assets/**'
      - 'vendor/**'
      - 'server/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-cards
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Build compressed site
        run: |
          npm ci
          npm run build:site

      # 多人运行时复用 JS/数据/WASM；这些输入变化后也必须重启常驻 Node。
      - name: Detect backend changes
        id: diff
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --pretty=format: --name-only HEAD)
          fi
          echo "$CHANGED" | sed 's/^/  changed: /'
          if echo "$CHANGED" | grep -qE '^server/.*\.py$|^server/requirements\.txt$|^tools/(arena-runtime-entry|build-arena)\.mjs$|^js/|^data/|^vendor/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      # 没配密钥时整步跳过：fork / PR / 未配置仓库都不会失败
      - name: Check deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.CARDS_DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CARDS_DEPLOY_HOST，跳过部署（只构建）"
          fi

      - name: Install ssh key
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CARDS_DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.CARDS_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload dist
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.CARDS_DEPLOY_HOST }}
          USER: ${{ secrets.CARDS_DEPLOY_USER }}
          TARGET: ${{ secrets.CARDS_DEPLOY_PATH }}
          PORT: ${{ secrets.CARDS_DEPLOY_PORT }}
        run: |
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/srv/namerena-cards/dist}"
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            dist/ "$USER@$HOST:$TARGET/"

      - name: Upload server code
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.CARDS_DEPLOY_HOST }}
          USER: ${{ secrets.CARDS_DEPLOY_USER }}
          TARGET: ${{ secrets.CARDS_DEPLOY_PATH }}
          PORT: ${{ secrets.CARDS_DEPLOY_PORT }}
        run: |
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/srv/namerena-cards/dist}"
          SERVER_DIR="$(dirname "$TARGET")/server"
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            --exclude '__pycache__/' --exclude '*.sqlite3*' \
            server/ "$USER@$HOST:$SERVER_DIR/"

      # 依赖只在 requirements.txt 变化时更新（避免每次部署都跑 pip）
      - name: Update backend dependencies
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.CARDS_DEPLOY_HOST }}
          USER: ${{ secrets.CARDS_DEPLOY_USER }}
          PORT: ${{ secrets.CARDS_DEPLOY_PORT }}
          TARGET: ${{ secrets.CARDS_DEPLOY_PATH }}
        run: |
          if ! git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^server/requirements\.txt$'; then
            echo "::notice::requirements.txt 未变化，跳过 pip"
            exit 0
          fi
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/srv/namerena-cards/dist}"
          SERVER_DIR="$(dirname "$TARGET")/server"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "cd '$SERVER_DIR' && pip install --user -r requirements.txt"
      # 完整重启会一并清理旧 Node；未结束战斗从数据库恢复。
      - name: Reload backend
        if: steps.gate.outputs.enabled == 'true' && steps.diff.outputs.backend == 'true'
        env:
          HOST: ${{ secrets.CARDS_DEPLOY_HOST }}
          USER: ${{ secrets.CARDS_DEPLOY_USER }}
          PORT: ${{ secrets.CARDS_DEPLOY_PORT }}
          RELOAD: ${{ secrets.CARDS_RELOAD_CMD }}
        run: |
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "${RELOAD:-sudo systemctl restart cards-backend}"

      - name: Note skipped reload
        if: steps.gate.outputs.enabled == 'true' && steps.diff.outputs.backend != 'true'
        run: echo "::notice::本次只更新了静态产物，未重启后端（无需重启）"
