# 推送主分支后构建并发布压缩产物，避免将开发源码作为站点提供。
name: Deploy compressed Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Build compressed site
        run: npm run build:site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
