# 与主站同源：/cards/ 交给后端托管静态产物，/api/cards/ 交给同一个后端
#
# 关键点：两个 location 必须在**同一个 server 块**（同一 host:port）里，
# 否则 cookie 不会跟着走，登录态永远拿不到。

server {
    listen 443 ssl http2;
    server_name shenjack.top;

    # ... 你现有的 ssl / 其它 location 保持不变 ...

    # 游戏静态站点 + API（同一个后端进程）
    location /cards/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/cards/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 15s;
    }
}
